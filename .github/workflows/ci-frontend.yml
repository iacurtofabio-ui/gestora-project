name: CI Frontend

on:
  push:
    branches: [main, dev, v2, v3]
    paths:
      - 'gestora-frontend/**'
  pull_request:
    branches: [main, dev, v2, v3]
    paths:
      - 'gestora-frontend/**'

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestora-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Stessa versione dello sviluppo locale. Con la 20 i test non partono nemmeno:
          # jsdom 30, undici 8 e vitest 5 richiedono Node 22.19+ o 24.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: gestora-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # AUD-M9: i test giravano solo a mano. npm test non controlla i tipi: lo fa la build.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
