<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Stesso simbolo del logo in-app (src/components/Logo.tsx): un tavolo visto dall'alto con
    quattro coperti attorno. Qui i colori sono scritti a mano e non presi dal tema, perche' la
    scheda del browser non ha accesso al CSS dell'applicazione.
    Blu #194bd1 = --primary del tema chiaro (oklch 0.476 0.212 264), su fondo bianco.
    Va riallineato a mano se cambia il colore di marca (V2-023: era ancora l'ambra del vecchio tema).
  -->
  <rect width="32" height="32" rx="7" fill="#ffffff" />
  <g fill="none" stroke="#194bd1" stroke-width="2.5" stroke-linecap="round">
    <circle cx="16" cy="16" r="6.5" />
    <path d="M16 4.5v2.5M16 25v2.5M4.5 16h2.5M25 16h2.5" />
  </g>
</svg>
